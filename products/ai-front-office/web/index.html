    <link rel="manifest" href="/app/manifest.webmanifest" />

    <style>
      /* Home Screen app: no rubber-band pull that shows a gap above the top bar, and text never resized on rotate. */
      @media (display-mode: standalone) { html, body { overscroll-behavior-y: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } }
    </style>
    <title>Call Otto</title>
